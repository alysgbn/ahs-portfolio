<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <style>
    .ink { stroke: #ececec; }
    .ink-fill { fill: #ececec; }
    .soft { stroke: #ececec; stroke-opacity: 0.28; }
    .dot { fill: #ececec; fill-opacity: 0.08; }
    .card { fill: #ffffff; fill-opacity: 0.04; }
    @media (prefers-color-scheme: light) {
      .ink { stroke: #1c1c1c; }
      .ink-fill { fill: #1c1c1c; }
      .soft { stroke: #1c1c1c; stroke-opacity: 0.25; }
      .dot { fill: #1c1c1c; fill-opacity: 0.08; }
      .card { fill: #000000; fill-opacity: 0.03; }
    }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6b08" />
      <stop offset="1" stop-color="#f32170" />
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f32170" />
      <stop offset="1" stop-color="#cf23cf" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="dot" />
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#grid)" />

  <!-- pipeline: warehouse → analysis → product -->
  <path d="M138 150 H168" class="soft" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" />
  <path d="M262 150 H284" class="soft" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" />

  <!-- database -->
  <g class="ink" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="98" cy="102" rx="40" ry="12" />
    <path d="M58 102 V198 C58 205 76 210 98 210 C120 210 138 205 138 198 V102" />
    <path d="M58 134 C58 141 76 146 98 146 C120 146 138 141 138 134" />
    <path d="M58 166 C58 173 76 178 98 178 C120 178 138 173 138 166" />
  </g>
  <circle cx="124" cy="122" r="3" fill="#ff6b08" />
  <circle cx="124" cy="155" r="3" fill="#ff6b08" fill-opacity="0.6" />
  <circle cx="124" cy="188" r="3" fill="#ff6b08" fill-opacity="0.35" />

  <!-- bar chart -->
  <rect x="180" y="168" width="18" height="42" rx="4" fill="url(#bar)" fill-opacity="0.55" />
  <rect x="206" y="138" width="18" height="72" rx="4" fill="url(#bar)" fill-opacity="0.8" />
  <rect x="232" y="100" width="18" height="110" rx="4" fill="url(#bar)" />
  <path d="M172 216 H258" class="ink" stroke-width="2.5" stroke-linecap="round" />

  <!-- code window -->
  <rect x="290" y="96" width="82" height="114" rx="12" class="card" />
  <rect x="290" y="96" width="82" height="114" rx="12" class="ink" stroke-width="2.5" />
  <path d="M290 118 H372" class="soft" stroke-width="2" />
  <circle cx="303" cy="107" r="2.6" class="ink-fill" fill-opacity="0.5" />
  <circle cx="312" cy="107" r="2.6" class="ink-fill" fill-opacity="0.35" />
  <circle cx="321" cy="107" r="2.6" class="ink-fill" fill-opacity="0.2" />
  <g stroke="url(#code)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M314 150 L302 163 L314 176" />
    <path d="M348 150 L360 163 L348 176" />
    <path d="M336 146 L326 180" />
  </g>
  <path d="M302 194 H340" class="soft" stroke-width="2" stroke-linecap="round" />
</svg>
